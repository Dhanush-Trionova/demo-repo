<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <link rel="stylesheet" href="./asset/css/swiper.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>

    <!-- <div class="swiper-container"> -->
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/a11.jpg" class="swiper-img">
                </div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/customer/thumbnail2.jpg" class="swiper-img">
                </div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/customer/thumbnail3.jpg" class="swiper-img">
                </div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/customer/thumbnail4.jpg" class="swiper-img">
                </div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/customer/thumbnail5.jpg" class="swiper-img">
                </div>
            </div>
            <div class="swiper-slide">
                <div class="swiper-iframe">
                    <img src="./asset/images/customer/thumbnail6.jpg" class="swiper-img">
                </div>
            </div>
        </div>
        <div class="swiper-btn-prev"><i class="fa-solid fa-angle-left"></i></div>
        <div class="swiper-btn-next"><i class="fa-solid fa-angle-right"></i></div>
        <div class="swiper-pagination"></div>
    </div>
    <!-- </div> -->


    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        var swiper = new Swiper(".swiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            autoplay: false,
            slidesPerView: "auto",
            spaceBetween: -60,
            coverflowEffect: {
                rotate: 0,
                stretch: 0,
                depth: 100,
                modifier: 3,
                slideShadows: false
            },
            loop: true,
            keyboard: {
                enabled: true
            },
            mousewheel: false,
            navigation: {
                nextEl: ".swiper-btn-next",
                prevEl: ".swiper-btn-prev"
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
          breakpoints: {
                560: {
                    slidesPerView: 2.5
                },
                768: {
                    slidesPerView: 3
                },
                1024: {
                    slidesPerView: 3
                }
            }
        });
    </script>

</body>

</html>
