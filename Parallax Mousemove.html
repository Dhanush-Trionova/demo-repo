<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parallax Mousemove</title>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #222;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 120%;
      height: 120%;
      background-image: url('/asset/images/a11.jpg');
      background-size: cover;
      background-position: center;
      transform: translate(0px, 0px);
      transition: transform 0.1s ease-out;
    }

    .content {
      position: relative;
      z-index: 10;
      color: white;
      text-align: center;
      padding-top: 100px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>

  <div class="content">
    <h1>Move Your Mouse</h1>
    <p>Parallax background follows your pointer!</p>
  </div>

  <script>
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      document.querySelector('.bg-layer').style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>

</body>
</html>
